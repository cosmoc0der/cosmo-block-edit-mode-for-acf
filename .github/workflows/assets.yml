name: Update assets

on:
  push:
    branches:
      - main
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'

# Both workflows commit to the same SVN repository; running them side by side
# makes the later commit fail with a conflict on trunk/readme.txt.
concurrency: wporg-svn

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure assets directory exists
        run: mkdir -p .wordpress-org

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cosmo-block-edit-mode-for-acf
          IGNORE_OTHER_FILES: true
